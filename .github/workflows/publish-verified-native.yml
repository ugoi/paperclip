name: Publish verified native candidate
on:
  push:
    branches: [ops/publish-native-5520764]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.repository == 'ugoi/paperclip'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 5520764c9e15881c0b18d7eadbd4dfb7a302e742
      - name: Verify exact-source Darwin artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/darwin-runner"
          gh release download stefan-native-5520764 --repo ugoi/paperclip --pattern darwin-runner-5520764.tar.gz --dir "$RUNNER_TEMP"
          echo "dad705e89e543c233a328722392c62062072474fda71d08e88570eb4160122ed  $RUNNER_TEMP/darwin-runner-5520764.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/darwin-runner-5520764.tar.gz" -C "$RUNNER_TEMP/darwin-runner"
          cd "$RUNNER_TEMP/darwin-runner"
          test "$(cat SOURCE_REVISION)" = 5520764c9e15881c0b18d7eadbd4dfb7a302e742
          sha256sum -c SHA256SUMS
          echo 'cd9f44daf9b88cbd6e03323a572af26b10b0a14030568d3970d3c83ccb487b26  paperclip-runnerd' | sha256sum -c -
          jq -e '.commit == "5520764c9e15881c0b18d7eadbd4dfb7a302e742" and .runnerCoreRecompiled and .testsPassed and .sourceManifestMatchesCapture and .sourceUnchangedDuringBuild and .sourceFilesVerified == 1315' VERIFICATION.json
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Resolve exact-source Core to its immutable digest
        id: core
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 120); do
            if docker buildx imagetools inspect ghcr.io/ugoi/paperclip:core-5520764c9e15881c0b18d7eadbd4dfb7a302e742 --format '{{json .Manifest}}' > "$RUNNER_TEMP/core-manifest.json"; then
              ready=true
              break
            fi
            sleep 10
          done
          test "$ready" = true
          digest=$(jq -r '.digest' "$RUNNER_TEMP/core-manifest.json")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image=ghcr.io/ugoi/paperclip@$digest" >> "$GITHUB_OUTPUT"
          # The inherited runtime stamp must agree with the artifact source.
          printf '\nRUN test "$PAPERCLIP_BUILD_COMMIT" = "5520764c9e15881c0b18d7eadbd4dfb7a302e742"\n' >> Dockerfile.remote-runner
      - name: Publish verified combined candidate
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.remote-runner
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ugoi/paperclip:stefan-5520764c9e15881c0b18d7eadbd4dfb7a302e742
          build-contexts: |
            darwin-runner=${{ runner.temp }}/darwin-runner
          build-args: |
            PAPERCLIP_CORE_IMAGE=${{ steps.core.outputs.image }}
            DARWIN_RUNNER_SHA256=cd9f44daf9b88cbd6e03323a572af26b10b0a14030568d3970d3c83ccb487b26
      - name: Record provenance
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          CORE_IMAGE: ${{ steps.core.outputs.image }}
        run: |
          printf 'Source: `5520764c9e15881c0b18d7eadbd4dfb7a302e742`\n\nCore: `%s`\n\nCombined image: `ghcr.io/ugoi/paperclip@%s`\n\nDarwin was built and tested from exact source on the existing Mac after hosted ARM capacity failure. Archive and binary checksums were verified independently. This job does not deploy.\n' "$CORE_IMAGE" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
