name: Stefan production image
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: package-existing-ccce
  cancel-in-progress: false
jobs:
  image:
    if: github.repository == 'ugoi/paperclip'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ccce203d55fe35a728ee139b2e513f66cc176323
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: darwin-runner-ccce203d55fe35a728ee139b2e513f66cc176323
          run-id: 39764482117
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/darwin-runner
      - name: Verify artifact revision and checksum
        id: darwin
        working-directory: ${{ runner.temp }}/darwin-runner
        run: |
          set -euo pipefail
          test "$(cat SOURCE_REVISION)" = ccce203d55fe35a728ee139b2e513f66cc176323
          sha256sum -c SHA256SUMS
          echo "sha256=$(sha256sum paperclip-runnerd | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Verify published Core source identity
        run: |
          set -euo pipefail
          docker buildx imagetools inspect ghcr.io/ugoi/paperclip@sha256:a6cb293361efaefd93894a7553ad8ad8d4c0d7262439454d275234fb1e44684e --format '{{json .Image}}' > "$RUNNER_TEMP/core-config.json"
          python3 - "$RUNNER_TEMP/core-config.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          configs=[data] if 'config' in data else list(data.values())
          linux=[c for c in configs if c.get('os')=='linux' and c.get('architecture')=='amd64']
          assert len(linux)==1
          assert linux[0]['config']['Labels']['org.opencontainers.image.revision']=='ccce203d55fe35a728ee139b2e513f66cc176323'
          PY
      - name: Package the verified existing Linux and Darwin artifacts
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.remote-runner
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ugoi/paperclip:stefan-ccce203d55fe35a728ee139b2e513f66cc176323-repack
          build-contexts: |
            darwin-runner=${{ runner.temp }}/darwin-runner
          build-args: |
            PAPERCLIP_CORE_IMAGE=ghcr.io/ugoi/paperclip@sha256:a6cb293361efaefd93894a7553ad8ad8d4c0d7262439454d275234fb1e44684e
            DARWIN_RUNNER_SHA256=${{ steps.darwin.outputs.sha256 }}
      - name: Record candidate identity
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Source: `ccce203d55fe35a728ee139b2e513f66cc176323`\n\nImage: `ghcr.io/ugoi/paperclip@%s`\n\nRepackages the exact published Core and successful Darwin artifact from run 39764482117. No Core source rebuild or credential changes.\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
